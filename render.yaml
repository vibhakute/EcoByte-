# Render Blueprint: dashboard.render.com → New → Blueprint → pick this repository.
# Creates the EcoByte web service (Docker) and a PostgreSQL database, and wires them together.
services:
  - type: web
    name: ecobyte
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true            # every git push redeploys
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ecobyte-db
          property: connectionString
      - key: ECOBYTE_SECRET_KEY  # signs login tokens
        generateValue: true
      - key: ECOBYTE_ADMIN_EMAIL
        value: admin@ecobyte.app
      - key: ECOBYTE_ADMIN_PASSWORD  # Render asks you for this when you create the Blueprint
        sync: false
      - key: ECOBYTE_DEMO_ACCOUNTS   # no public demo students in production
        value: "0"

databases:
  - name: ecobyte-db
    plan: free
    databaseName: ecobyte
    user: ecobyte
